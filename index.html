<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
    <title>Calculadora de Porcentagem</title>
</head>
<body>
    <div class="container">
        <div class="campo">
            <h2>Calculadora de Porcentagem</h2>
            <p>Digite o valor desejado</p>
            <label for="valor">valor</label>
            <input type="number" id="inputValor" placeholder="Digite o valor">
        </div>
        <div class="campo">
            <label for="porcentagem">porcentagem Desejada</label>
            <input type="number" id="inputPorcentagem" placeholder="Digite a porcentagem desejada">
        </div>
        <button id="btn-calcular">Calcular Porcentagem</button>

        <p id="total"></p>
    </div>
</body>
</html>
